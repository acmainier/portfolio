    <header>
      <nav aria-label="Main navigation">
        <h1 id="name">Anne-Cécile Mainier</h1>

    <main>
      <section id="contact">
        <h2>Contact</h2>
        <p>Have an interesting project? I would love to hear about it!</p>
        <form class="contact-form" action="submit.php" method="post">
          <div class="form-item">
            <label for="contact-name">Name</label>
            <input
              type="text"
              id="contact-name"
              name="name"
              placeholder="Your name"
            />
          </div>
          <div class="form-item">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Your email"
            />
          </div>
          <div class="form-item">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Your message"
            ></textarea>
          </div>
          <button type="submit" class="submit-button">Send message</button>
        </form>

        <div class="contact-links">
          <a
            href="https://www.linkedin.com/in/anne-cecile-mainier-57727923/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
          <a
            href="https://github.com/acmainier"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
          <a href="mailto:notmyrealemail@gmail.com">Email</a>
          <a href="tel:0123456789" class="contact-link">Phone</a>
        </div>
      </section>
    </main>
    <footer>Made with <span class="heart">♥</span> in London</footer>
